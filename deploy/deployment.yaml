apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher-operator
  namespace: storage-operator-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: watcher-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watcher-operator
    spec:
      serviceAccountName: watcher-operator
      containers:
        - name: operator
          image: watcher-operator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: watcher-operator-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KOPF_PEERING_NAME
              value: watcher-operator
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: watcher-operator
