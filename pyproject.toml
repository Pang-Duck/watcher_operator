[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watcher-operator"
version = "0.1.0"
description = "Prototype Kubernetes operator logic for HA local-path PV workloads."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
watcher-operator = "watcher_operator.__main__:main"

[project.optional-dependencies]
operator = [
  "kopf>=1.38.0,<2",
  "kubernetes>=30.1.0,<35",
]
test = []

[tool.setuptools.packages.find]
where = ["src"]
