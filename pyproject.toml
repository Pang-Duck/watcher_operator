[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "watcher-operator"
version = "0.1.0"
description = "Prototype Kubernetes operator logic for HA local-path PV workloads."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
operator = [
  "kopf>=1.37.0",
  "kubernetes>=29.0.0",
]
test = []

[tool.setuptools.packages.find]
where = ["src"]
